<div class="pry-footer__glow" aria-hidden="true"></div>

<div class="pry-footer__top">
  <div class="pry-footer__brand">
    <pry-wordmark [size]="20" />
    @if (tagline()) {
      <p class="pry-footer__tagline">{{ tagline() }}</p>
    }
  </div>

  @for (col of columns(); track col.title) {
    <div class="pry-footer__col">
      <span class="pry-footer__col-title">{{ col.title }}</span>
      @for (l of col.links; track l.path) {
        <a class="pry-footer__link" [routerLink]="l.path">{{ l.label }}</a>
      }
    </div>
  }
</div>

<div class="pry-footer__legal">
  <span>{{ legal() }}</span>
  @if (note()) {
    <span class="pry-footer__note">{{ note() }}</span>
  }
</div>
